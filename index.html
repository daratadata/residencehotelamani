<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E3B2C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Résidence Hotel Amani</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0E3B2C;--g2:#1B5A44;--gold:#B58A3C;--gold2:#D9B96A;--bg:#FAF8F3;--ink:#18231E;--mut:#66726C;--line:#E4DFD2;--red:#B3382C;--ok:#2E7D52;--card:#fff;--sh:0 1px 0 var(--line)}
@media(prefers-color-scheme:dark){:root{--bg:#0B1612;--ink:#EDEBE3;--mut:#9AA7A0;--line:#25362E;--card:#122019;--g:#0E3B2C}}
[hidden]{display:none!important}*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;margin:0;line-height:1.1}
header{background:var(--g);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:"Cormorant Garamond",serif;font-weight:700;font-size:20px;letter-spacing:.04em}
.brand img{width:34px;height:34px;border-radius:8px}.brand small{display:block;font:600 10px Manrope;letter-spacing:.2em;color:var(--gold2)}
nav{display:flex;flex-wrap:wrap;gap:0 2px;margin-left:auto;min-width:0}nav button{padding:8px 10px!important}#who{display:flex;align-items:center;gap:8px;flex:none}@media(max-width:800px){nav{order:9;flex:1 1 100%;margin-left:0}}
nav button{background:none;border:0;color:#cfe0d7;padding:8px 12px;font:600 14px Manrope;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-color:var(--gold2)}
main{max-width:1100px;margin:0 auto;padding:18px 16px 90px}
.hero{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border-radius:14px;padding:34px 24px;margin-bottom:22px;border-bottom:4px solid var(--gold)}
.hero h1{font-size:clamp(32px,6vw,52px);max-width:14ch}.hero p{color:#cfe0d7;max-width:46ch;margin:10px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h3{font-size:24px}.price{font:700 20px "Cormorant Garamond";color:var(--gold)}
.mut{color:var(--mut);font-size:13px}
button.p,button.s,a.p{display:inline-block;border:0;border-radius:8px;padding:10px 16px;font:700 14px Manrope;cursor:pointer;text-decoration:none}
.p{background:var(--g);color:#fff}.s{background:none;border:1px solid var(--line)!important;color:var(--ink)}.w{background:#1FA855;color:#fff}.d{background:var(--red);color:#fff}
button.sm{padding:6px 10px;font-size:12px;margin:2px}
label{display:block;font-weight:600;font-size:13px;margin-top:12px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink);margin-top:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi b{display:block;font:700 30px "Cormorant Garamond"}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:700;background:var(--line)}
.en_attente{background:#F6E7BE;color:#6b4e00}.confirmee,.libre{background:#CFE8D8;color:#14532d}.arrivee,.occupee{background:#CDDCF2;color:#1d3f7a}.terminee{background:var(--line)}.annulee,.maintenance{background:#F3CFCB;color:#7a1d14}.nettoyage{background:#E6D8F3;color:#4b2a7a}
table{width:100%;border-collapse:collapse}td,th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.scroll{overflow-x:auto}
dialog{border:0;border-radius:12px;max-width:460px;width:calc(100% - 24px);background:var(--card);color:var(--ink)}dialog::backdrop{background:#0008}
.auth{max-width:400px;margin:30px auto}.err{color:var(--red);font-weight:600;min-height:20px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;border-radius:50px;padding:14px 18px;box-shadow:0 4px 14px #0004}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 16px;border-radius:8px;z-index:20}
@media print{header,button,select,.fab,#toast,.hero{display:none!important}body{background:#fff;color:#000}}

.kpis .kpi{border:0;color:#fff;box-shadow:0 6px 18px #0e3b2c26}.kpis .kpi span{color:#ffffffd9}
.kpis .kpi:nth-child(1){background:linear-gradient(135deg,#1B5A44,#0E3B2C)}.kpis .kpi:nth-child(2){background:linear-gradient(135deg,#C9A04C,#9A7425)}
.kpis .kpi:nth-child(3){background:linear-gradient(135deg,#2F6DB5,#1F4A82)}.kpis .kpi:nth-child(4){background:linear-gradient(135deg,#7A52B8,#523581)}
.card{transition:transform .2s,box-shadow .2s}.grid .card:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0e3b2c24}
.rm{border-left:5px solid var(--line)}.rm.libre{border-left-color:#2E7D52}.rm.occupee{border-left-color:#2F6DB5}.rm.nettoyage{border-left-color:#8A5BC2}.rm.maintenance{border-left-color:#B3382C}
nav button{border-radius:8px 8px 0 0;transition:color .2s,background .2s,border-color .2s}nav button:hover{color:#fff;background:#ffffff1a}
header{background:linear-gradient(90deg,#0E3B2C,#14513C)}.p{transition:filter .2s,transform .1s}.p:hover{filter:brightness(1.12)}.p:active{transform:scale(.97)}
@media(prefers-reduced-motion:no-preference){#app>*{animation:up .4s ease both}@keyframes up{from{opacity:0;transform:translateY(10px)}}.hero{background-size:200% 200%;animation:flow 14s ease infinite}@keyframes flow{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:no-preference){.hero{animation:in .6s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>
<body>
<header><div class="bar"><div class="brand"><img src="icon.svg" alt=""><div>RÉSIDENCE HOTEL<small>AMANI</small></div></div><nav id="nav"></nav><div id="who"></div><button id="inst" class="s sm" hidden style="color:#fff">Installer</button></div></header>
<main id="app"></main>
<dialog id="dlg"></dialog><div id="toast" hidden role="status"></div>
<script>
/* Modules v2 : calendrier, caisse, ménage, registre de police, surveillance, rapports, photos */
const MET={especes:'Espèces',orange_money:'Orange Money',mtn_momo:'MTN MoMo',wave:'Wave',moov:'Moov',carte:'Carte'};
const KIND={acompte:'Acompte',solde:'Solde',caution:'Caution',remboursement:'Remboursement'};
let pays=[],clos=[],watch=[],off=0,rp=7,rg=30;
const sum=a=>a.reduce((s,x)=>s+x,0),opts=o=>Object.entries(o).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
const total=b=>b.total??nights(b)*(b.room_types?.price||0);
const paid=id=>sum(pays.filter(p=>p.booking_id===id&&(p.kind==='acompte'||p.kind==='solde')).map(p=>p.amount));
const iso=d=>new Date(d).toISOString().slice(0,10);
const csv=(name,rows)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\n')],{type:'text/csv'}));a.download=name;a.click()};

async function loadMore(){
 pays=(await db.from('payments').select('*,bookings(guest_name,profiles(full_name),rooms(number))').order('at',{ascending:false})).data||[];
 clos=(await db.from('cash_closings').select('*').order('at',{ascending:false}).limit(20)).data||[];
 watch=manage()||conf()?(await db.from('watchlist').select('*').order('created_at',{ascending:false})).data||[]:[];
}
function staffTabs(){const T={dash:'Tableau de bord'};if(manage())T.rec='Réception';Object.assign(T,{res:'Réservations',cal:'Calendrier',rooms:'Chambres'});if(manage())T.hk='Ménage';T.cash='Caisse';T.reg='Registre';if(manage())T.watch='À surveiller';if(me.role!=='receptionniste')T.rep='Rapports';if(conf())T.set='Paramètres';if(me.role==='admin')T.users='Utilisateurs';return T}

/* Calendrier d'occupation */
function vCal(){const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+off+i);return iso(d)});
 const at=(r,d)=>data.find(b=>b.room_id===r.id&&['confirmee','arrivee'].includes(b.status)&&b.check_in<=d&&d<b.check_out);
 return `<h2 style="margin-bottom:10px">Calendrier d'occupation</h2><p><button class="s sm" onclick="off-=14;render()">Avant</button><button class="s sm" onclick="off=0;render()">Aujourd'hui</button><button class="s sm" onclick="off+=14;render()">Après</button></p>
<div class="card scroll"><table><tr><th>Ch.</th>${days.map(d=>`<th>${dt(d)}</th>`).join('')}</tr>${rooms.map(r=>`<tr><td><b>${esc(r.number)}</b></td>${days.map(d=>{const b=at(r,d);return `<td title="${b?esc(gn(b)):''}" style="padding:4px;font-size:11px;background:${b?(b.status==='arrivee'?'#CDDCF2':'#CFE8D8'):'none'};color:#14301f">${b?esc((gn(b)||'').split(' ')[0]):''}</td>`}).join('')}</tr>`).join('')}</table></div>
<p class="mut">Vert : réservée · Bleu : client en séjour.</p>`}

/* Ménage */
function vHk(){const L=rooms.filter(r=>r.status==='nettoyage');
 return `<h2 style="margin-bottom:10px">Ménage</h2><div class="card">${L.map(r=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0"><b>Chambre ${esc(r.number)}</b><button class="p sm" onclick="roomSt(${r.id},'libre')">Nettoyage terminé</button></div>`).join('')||'<p class="mut">Aucune chambre à nettoyer.</p>'}</div>`}

/* Arrivée : fiche de police + contrôle liste de surveillance + caution */
function arrive(id){const b=data.find(x=>x.id===id);
 dlg(`<h2>Arrivée de ${esc(gn(b))}</h2><form onsubmit="doArrive(event,${id})"><label>Nationalité<input name="nat" value="${esc(b.nationality||'Ivoirienne')}" required></label>
<div class="row"><label>Pièce<select name="it"><option>CNI</option><option>Passeport</option><option>Permis</option><option>Autre</option></select></label><label>Numéro<input name="in" value="${esc(b.id_number||'')}" required></label></div>
<label>Venant de (ville / pays)<input name="pr" value="${esc(b.provenance||'')}"></label>
<div class="row"><label>Caution (F, facultatif)<input name="c" type="number" min="0" step="500" value="0"></label><label>Mode<select name="m">${opts(modes())}</select></label></div>
<p class="err" id="err"></p><button class="p">Valider l'arrivée</button> <button type="button" class="s" onclick="closeD()">Annuler</button></form>`)}
async function doArrive(e,id){e.preventDefault();const f=e.target,b=data.find(x=>x.id===id),n=s=>String(s||'').replace(/\s/g,'').toLowerCase();
 const w=watch.find(w=>(w.phone&&n(w.phone)===n(gp(b)))||(w.id_number&&n(w.id_number)===n(f.in.value))||(w.name&&n(w.name)===n(gn(b))));
 if(w&&!confirm(`Client à surveiller : ${w.reason}. Valider quand même l'arrivée ?`))return;
 const{error}=await db.from('bookings').update({status:'arrivee',nationality:f.nat.value.trim(),id_type:f.it.value,id_number:f.in.value.trim(),provenance:f.pr.value.trim()}).eq('id',id);
 if(error)return $('#err').textContent=error.message;
 if(+f.c.value>0)await db.from('payments').insert({booking_id:id,kind:'caution',method:f.m.value,amount:+f.c.value});
 await roomSt(b.room_id,'occupee');closeD();await load();render()}

/* Encaissement */
function pay(id){const b=data.find(x=>x.id===id),due=Math.max(0,total(b)-paid(id));
 dlg(`<h2>Encaisser · ${esc(gn(b))}</h2><p class="mut">Séjour ${fmt(total(b))} · déjà payé ${fmt(paid(id))} · reste ${fmt(due)}</p><form onsubmit="doPay(event,${id})"><div class="row"><label>Type<select name="k">${opts(KIND)}</select></label><label>Mode<select name="m">${opts(modes())}</select></label></div>
<label>Montant (F)<input name="a" type="number" min="1" step="100" value="${due||''}" required></label><label>Référence Mobile Money (facultatif)<input name="r"></label><p class="err" id="err"></p><button class="p">Enregistrer</button> <button type="button" class="s" onclick="closeD()">Annuler</button></form>`)}
async function doPay(e,id){e.preventDefault();const f=e.target,{error}=await db.from('payments').insert({booking_id:id,kind:f.k.value,method:f.m.value,amount:+f.a.value,ref:f.r.value});
 if(error)return $('#err').textContent=error.message;closeD();toast('Paiement enregistré');await load();render()}

/* Caisse */
function vCash(){const t0=new Date().setHours(0,0,0,0),last=clos.find(c=>c.by===me.id),since=Math.max(t0,last?+new Date(last.at):0),
 ps=pays.filter(p=>+new Date(p.at)>=since&&(p.by===me.id||!manage())),sgn=p=>p.kind==='remboursement'?-p.amount:p.amount,
 cash=sum(ps.filter(p=>p.method==='especes').map(sgn)),mob=sum(ps.filter(p=>p.method!=='especes').map(sgn)),
 debts=data.filter(b=>['arrivee','terminee'].includes(b.status)&&total(b)-paid(b.id)>0);
 return `<h2 style="margin-bottom:10px">Caisse</h2><div class="kpis"><div class="card kpi"><b>${fmt(cash)}</b><span class="mut">Espèces attendues</span></div><div class="card kpi"><b>${fmt(mob)}</b><span class="mut">Mobile Money et cartes</span></div></div>
${manage()?`<form class="card" style="max-width:380px" onsubmit="closeCash(event,${cash})"><b>Clôture de caisse</b><label>Espèces comptées (F)<input name="c" type="number" min="0" required></label><button class="p" style="margin-top:10px">Clôturer</button></form>`:''}
${debts.length?`<h3 style="margin:18px 0 8px">Impayés</h3><div class="card scroll"><table>${debts.map(b=>`<tr><td>${esc(gn(b))}</td><td class="mut">Ch. ${esc(b.rooms?.number)}</td><td><b>${fmt(total(b)-paid(b.id))}</b></td><td>${manage()?`<button class="p sm" onclick="pay(${b.id})">Encaisser</button>`:''}<a class="p w sm" style="padding:6px 10px;font-size:12px" target="_blank" rel="noopener" href="${wa(cw(gp(b)),`Bonjour ${gn(b)}, il reste ${fmt(total(b)-paid(b.id))} à régler pour votre séjour à Résidence Hotel Amani. Merci.`)}">Relancer</a></td></tr>`).join('')}</table></div>`:''}
<h3 style="margin:18px 0 8px">Opérations</h3><div class="card scroll"><table>${ps.map(p=>`<tr><td>${new Date(p.at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</td><td>${esc(gn(p.bookings))}</td><td>${KIND[p.kind]}</td><td>${MET[p.method]}${p.ref?' · '+esc(p.ref):''}</td><td><b>${p.kind==='remboursement'?'−':''}${fmt(p.amount)}</b></td></tr>`).join('')||'<tr><td>Aucune opération.</td></tr>'}</table></div>
${clos.length?`<h3 style="margin:18px 0 8px">Dernières clôtures</h3><div class="card scroll"><table>${clos.map(c=>`<tr><td>${dt(c.at)}</td><td>Attendu ${fmt(c.expected)}</td><td>Compté ${fmt(c.counted)}</td><td style="color:${c.counted-c.expected?'var(--red)':'var(--ok)'}"><b>Écart ${fmt(c.counted-c.expected)}</b></td></tr>`).join('')}</table></div>`:''}`}
async function closeCash(e,exp){e.preventDefault();const{error}=await db.from('cash_closings').insert({expected:exp,counted:+e.target.c.value});if(error)return toast(error.message);toast('Caisse clôturée');await load();render()}

/* Registre de police */
function vReg(){const from=Date.now()-rg*864e5,L=data.filter(b=>['arrivee','terminee'].includes(b.status)&&+new Date(b.check_in)>=from).sort((a,b)=>a.check_in<b.check_in?1:-1);
 return `<h2 style="margin-bottom:6px">Registre des voyageurs</h2><p class="mut">Fiche de police : remplie à chaque arrivée.</p><select style="max-width:200px" onchange="rg=+this.value;render()">${[[1,"Aujourd'hui"],[7,'7 jours'],[30,'30 jours'],[365,'12 mois']].map(([d,l])=>`<option value="${d}" ${d===rg?'selected':''}>${l}</option>`).join('')}</select>
<p><button class="p sm" onclick="print()">Imprimer</button><button class="s sm" onclick="expReg()">Exporter CSV</button></p><div class="card scroll"><table><tr><th>Arrivée</th><th>Départ</th><th>Ch.</th><th>Nom</th><th>Nationalité</th><th>Pièce</th><th>Venant de</th><th>Tél.</th></tr>
${L.map(b=>`<tr><td>${dt(b.check_in)}</td><td>${dt(b.check_out)}</td><td>${esc(b.rooms?.number)}</td><td>${esc(gn(b))}</td><td>${esc(b.nationality)}</td><td>${esc(b.id_type)} ${esc(b.id_number)}</td><td>${esc(b.provenance)}</td><td>${esc(gp(b))}</td></tr>`).join('')||'<tr><td>Aucun séjour sur la période.</td></tr>'}</table></div>`}
function expReg(){const from=Date.now()-rg*864e5;csv('registre-amani.csv',[['Arrivée','Départ','Chambre','Nom','Nationalité','Type pièce','N° pièce','Venant de','Téléphone'],...data.filter(b=>['arrivee','terminee'].includes(b.status)&&+new Date(b.check_in)>=from).map(b=>[b.check_in,b.check_out,b.rooms?.number,gn(b),b.nationality,b.id_type,b.id_number,b.provenance,gp(b)])])}

/* Liste à surveiller */
function vWatch(){return `<h2 style="margin-bottom:6px">Clients à surveiller</h2><p class="mut">Une alerte s'affiche à l'arrivée si le nom, le téléphone ou la pièce correspond. Données personnelles : ne gardez que le nécessaire.</p>
<form class="card" style="max-width:520px" onsubmit="addWatch(event)"><div class="row"><label>Nom<input name="n"></label><label>Téléphone<input name="p" type="tel"></label></div><div class="row"><label>N° de pièce<input name="d"></label><label>Motif<input name="m" required placeholder="ex. impayé"></label></div><button class="p" style="margin-top:10px">Ajouter</button></form>
<div class="card scroll" style="margin-top:12px"><table>${watch.map(w=>`<tr><td>${esc(w.name)}</td><td>${esc(w.phone)}</td><td>${esc(w.id_number)}</td><td>${esc(w.reason)}</td><td>${conf()?`<button class="d sm" onclick="delWatch(${w.id})">Retirer</button>`:''}</td></tr>`).join('')||'<tr><td class="mut">Liste vide.</td></tr>'}</table></div>`}
async function addWatch(e){e.preventDefault();const f=e.target;if(!(f.n.value||f.p.value||f.d.value))return toast('Renseignez un nom, un téléphone ou une pièce.');
 const{error}=await db.from('watchlist').insert({name:f.n.value.trim(),phone:f.p.value.trim(),id_number:f.d.value.trim(),reason:f.m.value.trim()});if(error)return toast(error.message);await load();render()}
async function delWatch(id){if(confirm('Retirer cette personne de la liste ?')){await db.from('watchlist').delete().eq('id',id);await load();render()}}

/* Rapports */
function vRep(){const from=Date.now()-rp*864e5,ps=pays.filter(p=>+new Date(p.at)>=from&&(p.kind==='acompte'||p.kind==='solde')),bs=data.filter(b=>+new Date(b.created_at)>=from),
 ns=sum(data.filter(b=>['arrivee','terminee'].includes(b.status)&&+new Date(b.check_in)>=from).map(nights));
 return `<h2 style="margin-bottom:10px">Rapports</h2><select style="max-width:200px" onchange="rp=+this.value;render()">${[[1,"Aujourd'hui"],[7,'7 jours'],[30,'30 jours'],[365,'12 mois']].map(([d,l])=>`<option value="${d}" ${d===rp?'selected':''}>${l}</option>`).join('')}</select>
<div class="kpis" style="margin-top:12px"><div class="card kpi"><b>${fmt(sum(ps.map(p=>p.amount)))}</b><span class="mut">Encaissé</span></div><div class="card kpi"><b>${bs.length}</b><span class="mut">Demandes reçues</span></div><div class="card kpi"><b>${bs.filter(b=>b.status==='annulee').length}</b><span class="mut">Annulées</span></div><div class="card kpi"><b>${ns}</b><span class="mut">Nuitées vendues</span></div></div>
<div class="card"><b>Par mode de paiement</b><table>${Object.entries(MET).map(([k,v])=>`<tr><td>${v}</td><td><b>${fmt(sum(ps.filter(p=>p.method===k).map(p=>p.amount)))}</b></td></tr>`).join('')}</table></div>
<p><button class="s sm" onclick="expPay()">Exporter les encaissements (CSV)</button> <button class="p sm" onclick="printReport()">Imprimer / PDF</button></p>`}
function expPay(){const from=Date.now()-rp*864e5;csv('encaissements-amani.csv',[['Date','Client','Chambre','Type','Mode','Montant','Référence'],...pays.filter(p=>+new Date(p.at)>=from).map(p=>[new Date(p.at).toLocaleString('fr-FR'),gn(p.bookings),p.bookings?.rooms?.number,p.kind,MET[p.method],p.kind==='remboursement'?-p.amount:p.amount,p.ref])])}

/* Photos des chambres */

 printDoc(`<!doctype html><meta charset=utf-8><title>Rapport</title><style>@page{size:A4;margin:14mm}body{font:12px/1.5 Arial,sans-serif;color:#111;margin:0}h1{font:700 22px Georgia,serif;color:#0E3B2C;margin:0}h2{font:700 14px Georgia,serif;color:#0E3B2C;margin:20px 0 6px}table{width:100%;border-collapse:collapse}th{background:#0E3B2C;color:#fff;padding:6px;text-align:left}td{padding:6px;border-bottom:1px solid #ddd}.k{display:flex;gap:10px}.k div{flex:1;border:1px solid #ccc;border-top:4px solid #B58A3C;padding:8px}.k b{display:block;font-size:18px}</style>
<div style="display:flex;justify-content:space-between;border-bottom:3px solid #B58A3C;padding-bottom:8px"><div><h1>${esc(h.name)}</h1>Rapport d'activité</div><div style="text-align:right">${L}<br>Édité le ${new Date().toLocaleString('fr-FR')}<br>par ${esc(me.full_name)}</div></div>
<h2>Synthèse</h2><div class=k><div><b>${fmt(sum(rv.map(p=>p.amount)))}</b>Encaissé</div><div><b>${bs.length}</b>Demandes reçues</div><div><b>${bs.filter(b=>b.status==='annulee').length}</b>Annulées</div><div><b>${ns}</b>Nuitées vendues</div></div>
<h2>Par mode de paiement</h2><table>${Object.entries(MET).map(([k,v])=>`<tr><td>${v}</td><td style="text-align:right"><b>${fmt(sum(rv.filter(p=>p.method===k).map(p=>p.amount)))}</b></td></tr>`).join('')}</table>
<h2>Détail des opérations</h2><table><tr><th>Date</th><th>Client</th><th>Type</th><th>Mode</th><th style="text-align:right">Montant</th></tr>${ps.map(p=>`<tr><td>${new Date(p.at).toLocaleString('fr-FR')}</td><td>${esc(gn(p.bookings))}</td><td>${KIND[p.kind]}</td><td>${MET[p.method]}</td><td style="text-align:right">${p.kind==='remboursement'?'-':''}${fmt(p.amount)}</td></tr>`).join('')||'<tr><td colspan=5>Aucune opération.</td></tr>'}</table>`)}

/* ---- Animations : compteurs ---- */
function decorate(){if(tab==='rec')recCalc();if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;document.querySelectorAll('.kpi b').forEach(el=>{const t=el.textContent,m=t.match(/^([\d\s\u00a0\u202f]+)( F)?$/);if(!m)return;const to=+m[1].replace(/\D/g,''),t0=performance.now(),step=n=>{const k=Math.min(1,(n-t0)/700),v=Math.round(to*(1-Math.pow(1-k,3)));el.textContent=m[2]?fmt(v):v;if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
Object.assign(XV,{rec:vRec,set:vSet});

</script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R={client:'Client',receptionniste:'Réceptionniste',gerant:'Gérant',proprietaire:'Propriétaire',admin:'Administrateur'};
const S={en_attente:'En attente',confirmee:'Confirmée',arrivee:'En séjour',terminee:'Terminée',annulee:'Annulée',libre:'Libre',occupee:'Occupée',nettoyage:'À nettoyer',maintenance:'Maintenance'};
const tag=s=>`<span class="tag ${s}">${S[s]}</span>`;
const fmt=n=>(n||0).toLocaleString('fr-FR')+' F',dt=d=>new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});
const nights=b=>Math.max(1,Math.round((new Date(b.check_out)-new Date(b.check_in))/864e5));
const wa=(p,t)=>`https://wa.me/${p}?text=${encodeURIComponent(t)}`,cw=p=>'225'+String(p||'').replace(/\D/g,'').slice(-10);
const mail=p=>String(p).replace(/\D/g,'').slice(-10)+'@amani.app';
let loadErr='',db,me=null,tab='home',types=[],rooms=[],data=[],users=[],mode='in';
const staff=()=>me&&me.role!=='client',manage=()=>['receptionniste','gerant','admin'].includes(me?.role),conf=()=>['gerant','admin'].includes(me?.role);
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2500)};
const dlg=h=>{$('#dlg').innerHTML=h;$('#dlg').showModal()},closeD=()=>$('#dlg').close();

async function boot(){
 if(CFG.url.startsWith('COLLER')){$('#app').innerHTML='<div class="card"><h2>Configuration requise</h2><p>Ouvrez <b>index.html</b>, remplacez COLLER_URL_SUPABASE et COLLER_CLE_ANON par les valeurs de votre projet Supabase.</p></div>';return}
 try{if(typeof supabase==='undefined')throw new Error("Le service Supabase n'a pas pu se charger. Vérifiez la connexion internet et rechargez la page.");
 db=supabase.createClient(CFG.url,CFG.key);
 const{data:{session}}=await db.auth.getSession();me=null;
 if(session)me=(await db.from('profiles').select('*').eq('id',session.user.id).single()).data;
 await load();if(me&&tab==='home'&&staff())tab='dash';render();
 }catch(e){$('#app').innerHTML=`<div class="card"><h2>Chargement impossible</h2><p>${esc(e.message)}</p><button class="p" onclick="location.reload()">Recharger</button></div>`}
}
addEventListener('error',e=>{if(!$('#app').innerHTML.trim())$('#app').innerHTML=`<div class="card"><h2>Erreur</h2><p>${esc(e.message)}</p></div>`});
async function load(){
 await loadSettings();
 {const r=await db.from('room_types').select('*').order('price');types=r.data||[];loadErr=r.error?r.error.message:''}
 if(!me)return;
 let q=db.from('bookings').select('*,profiles(full_name,phone),room_types(name,price),rooms(number)').order('created_at',{ascending:false});
 if(!staff())q=q.eq('client_id',me.id);data=(await q).data||[];
 if(staff()){rooms=(await db.from('rooms').select('*,room_types(name)').order('number')).data||[];await loadMore()}
 if(me.role==='admin')users=(await db.from('profiles').select('*').order('created_at')).data||[];
}
const go=async t=>{tab=t;await load();render()};
function render(){
 const T=!me?{home:'Chambres',auth:'Connexion'}:staff()?staffTabs():{home:'Chambres',mine:'Mes réservations'};
 $('#nav').innerHTML=Object.entries(T).map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${v}</button>`).join('')+(me?`<button onclick="out()">Déconnexion</button>`:''); $('#who').innerHTML=me?`<span style="font-size:12px;color:#cfe0d7">${esc(me.full_name)} · ${R[me.role]}</span><button class="s sm" style="color:#fff" onclick="out()">Déconnexion</button>`:'';
 $('#app').innerHTML=({home:vHome,auth:vAuth,mine:vMine,dash:vDash,res:vRes,rooms:vRooms,users:vUsers,...XV}[tab]||vHome)()+(me?`<button class="s" style="position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--card)" onclick="out()">Déconnexion</button>`:'')+`<p class="mut" style="text-align:center;margin-top:30px">Version 6</p>`+(staff()?'':`<a class="p w fab" target="_blank" rel="noopener" href="${wa(CFG.wa,"Bonjour Résidence Hotel Amani, j'ai une question.")}">WhatsApp</a>`);
 if(window.decorate)decorate();
}
async function out(){await db.auth.signOut();me=null;data=[];tab='home';render()}

/* ---- Client : chambres, inscription, réservation ---- */
function vHome(){return `<section class="hero"><h1>Confort, hospitalité, sérénité.</h1><p>Réservez votre chambre en quelques secondes et recevez la confirmation directement sur WhatsApp.</p>${me?'':`<button class="p" style="background:var(--gold)" onclick="mode='up';go('auth')">Créer mon compte</button>`}</section>
<div class="grid">${types.map(t=>`<div class="card">${t.photo_url?`<img src="${esc(t.photo_url)}" alt="${esc(t.name)}" loading="lazy" style="width:100%;height:170px;object-fit:cover;border-radius:8px;margin-bottom:10px">`:''}<h3>${esc(t.name)}</h3><p class="mut">${esc(t.description)}</p><p class="mut">${esc(t.amenities)} · ${t.capacity} pers.</p><div class="price">${fmt(t.price)} / nuit</div>${t.weekend?`<div class="mut">Week-end ${fmt(t.weekend)}</div>`:''}${t.h2?`<div class="mut">2 h ${fmt(t.h2)}${t.h3?` · 3 h ${fmt(t.h3)}`:''}</div>`:''}<button class="p" style="margin-top:10px" onclick="book(${t.id})">Réserver</button></div>`).join('')||`<p class="mut">Aucune chambre disponible.${loadErr?' Erreur : '+esc(loadErr):''}</p>`}</div>
<p class="mut" style="margin-top:18px">Appelez-nous : <a href="tel:${CFG.tel}">${CFG.tel}</a> · ${CFG.email}</p>`}
function vAuth(){const up=mode==='up';return `<form class="card auth" onsubmit="auth(event)"><h2>${up?'Créer mon compte':'Connexion'}</h2>
${up?'<label>Nom complet<input name="n" required autocomplete="name"></label>':''}<label>Numéro de téléphone<input name="p" type="tel" inputmode="tel" required placeholder="07 00 00 00 00" autocomplete="tel"></label>
<label>Mot de passe<input name="w" type="password" required minlength="6" autocomplete="${up?'new':'current'}-password"></label><p class="err" id="err"></p>
<button class="p">${up?'Créer mon compte':'Me connecter'}</button> <button type="button" class="s" onclick="mode='${up?'in':'up'}';render()">${up?'J\'ai déjà un compte':'Pas encore de compte'}</button></form>`}
async function auth(e){e.preventDefault();const f=e.target,p=f.p.value.replace(/\D/g,'').slice(-10);if(p.length<10)return $('#err').textContent='Entrez un numéro à 10 chiffres.';
 let r;if(mode==='up')r=await db.auth.signUp({email:mail(p),password:f.w.value,options:{data:{full_name:f.n.value.trim(),phone:p}}});else r=await db.auth.signInWithPassword({email:mail(p),password:f.w.value});
 if(r.error)return $('#err').textContent=r.error.message.includes('Invalid')?'Numéro ou mot de passe incorrect.':r.error.message.includes('registered')?'Ce numéro a déjà un compte.':r.error.message;
 tab='home';await boot()}
function book(tid){if(!me){mode='up';return go('auth')}const t=types.find(x=>x.id===tid),d=new Date().toISOString().slice(0,10);
 dlg(`<h2>${esc(t.name)}</h2><form onsubmit="saveBook(event,${tid})"><div class="row"><label>Arrivée<input name="a" type="date" min="${d}" value="${d}" required></label><label>Départ<input name="d" type="date" min="${d}" required></label></div>
<label>Personnes<input name="g" type="number" min="1" max="${t.capacity}" value="1"></label><label>Précisions (facultatif)<textarea name="n" rows="2"></textarea></label><p class="err" id="err"></p><button class="p">Envoyer la demande</button> <button type="button" class="s" onclick="closeD()">Annuler</button></form>`)}
async function saveBook(e,tid){e.preventDefault();const f=e.target;if(f.d.value<=f.a.value)return $('#err').textContent='La date de départ doit suivre l\'arrivée.';
 const{error}=await db.from('bookings').insert({client_id:me.id,type_id:tid,check_in:f.a.value,check_out:f.d.value,guests:+f.g.value,notes:f.n.value});
 if(error)return $('#err').textContent=error.message;const t=types.find(x=>x.id===tid);closeD();toast('Demande envoyée');
 window.open(wa(CFG.wa,`Bonjour, je suis ${me.full_name}. J'ai demandé une ${t.name} du ${dt(f.a.value)} au ${dt(f.d.value)} pour ${f.g.value} personne(s). Pouvez-vous confirmer ?`),'_blank');go('mine')}
function vMine(){return `<h2 style="margin-bottom:12px">Mes réservations</h2>${data.map(b=>`<div class="card" style="margin-bottom:10px"><b>${esc(b.room_types?.name)}</b> ${tag(b.status)}<div class="mut">${dt(b.check_in)} → ${dt(b.check_out)} · ${nights(b)} nuit(s) · ${fmt(nights(b)*(b.room_types?.price||0))}</div>
${b.rooms?`<div>Chambre ${esc(b.rooms.number)}</div>`:''}${b.status==='en_attente'?`<button class="s sm" onclick="setB(${b.id},'annulee')">Annuler</button>`:''}</div>`).join('')||'<p class="mut">Aucune réservation. Choisissez une chambre dans l\'onglet Chambres.</p>'}`}

/* ---- Personnel ---- */
async function setB(id,status,extra={}){const{error}=await db.from('bookings').update({status,...extra}).eq('id',id);if(error)return toast(error.message);await load();render()}
function vDash(){const t0=new Date().toISOString().slice(0,10),act=data.filter(b=>['confirmee','arrivee','terminee'].includes(b.status)),
 rev=act.reduce((s,b)=>s+nights(b)*(b.room_types?.price||0),0),occ=rooms.filter(r=>r.status==='occupee').length;
 return `<h2 style="margin-bottom:12px">Tableau de bord</h2><div class="kpis"><div class="card kpi"><b>${data.filter(b=>b.status==='en_attente').length}</b><span class="mut">Demandes à traiter</span></div>
<div class="card kpi"><b>${data.filter(b=>b.check_in===t0&&b.status==='confirmee').length}</b><span class="mut">Arrivées aujourd'hui</span></div><div class="card kpi"><b>${occ}/${rooms.length}</b><span class="mut">Chambres occupées</span></div><div class="card kpi"><b>${fmt(rev)}</b><span class="mut">Chiffre d'affaires réservé</span></div></div>
<div class="grid">${rooms.map(r=>`<div class="card rm ${r.status}"><b>${esc(r.number)}</b> ${tag(r.status)}<div class="mut">${esc(r.room_types?.name)}</div></div>`).join('')}</div>`}
let flt='en_attente';
function vRes(){const L=data.filter(b=>flt==='all'||b.status===flt);
 return `<h2 style="margin-bottom:12px">Réservations</h2><select style="max-width:220px" onchange="flt=this.value;render()">${['all',...Object.keys(S).slice(0,5)].map(k=>`<option value="${k}" ${k===flt?'selected':''}>${k==='all'?'Toutes':S[k]}</option>`).join('')}</select>
<div class="card scroll" style="margin-top:12px"><table>${L.map(b=>`<tr><td><b>${esc(gn(b))}</b><div class="mut">${esc(gp(b))}</div></td><td>${esc(b.room_types?.name)}${b.rooms?` · Ch. ${esc(b.rooms.number)}`:''}<div class="mut">${dt(b.check_in)} → ${dt(b.check_out)} · ${b.guests} pers.</div>${b.notes?`<div class="mut">${esc(b.notes)}</div>`:''}</td><td>${tag(b.status)}</td>
<td>${manage()?act(b):''}${docBtns(b)}${gp(b)?`<a class="p w sm" style="padding:6px 10px;font-size:12px" target="_blank" rel="noopener" href="${wa(cw(gp(b)),msg(b))}">WhatsApp</a>`:''}</td></tr>`).join('')||'<tr><td>Aucune réservation.</td></tr>'}</table></div>`}
const msg=b=>b.status==='confirmee'?`Bonjour ${gn(b)}, votre réservation du ${dt(b.check_in)} au ${dt(b.check_out)} est confirmée${b.rooms?` (chambre ${b.rooms.number})`:''}. Résidence Hotel Amani vous attend !`:`Bonjour ${gn(b)}, ici Résidence Hotel Amani, à propos de votre réservation du ${dt(b.check_in)}.`;
function act(b){const B=(s,l,c='s')=>`<button class="${c} sm" onclick="setB(${b.id},'${s}'${s==='arrivee'?',{}':''});${s==='arrivee'?`roomSt(${b.room_id},'occupee')`:s==='terminee'?`roomSt(${b.room_id},'nettoyage')`:''}">${l}</button>`;
 if(b.status==='en_attente')return `<button class="p sm" onclick="confirmB(${b.id},${b.type_id})">Confirmer</button>${B('annulee','Refuser','d')}`;
 const P=`<button class="s sm" onclick="pay(${b.id})">Encaisser</button>`;if(b.status==='confirmee')return `<button class="p sm" onclick="arrive(${b.id})">Arrivée</button>`+P+B('annulee','Annuler','d');if(b.status==='arrivee')return B('terminee','Départ','p')+P;if(b.status==='terminee')return P;return ''}
const roomSt=async(id,status)=>{if(id){await db.from('rooms').update({status}).eq('id',id);await load();render()}};
function confirmB(id,tid){const free=rooms.filter(r=>r.type_id===tid&&r.status==='libre');
 dlg(`<h2>Attribuer une chambre</h2><form onsubmit="doConf(event,${id})"><label>Chambre<select name="r" required>${free.map(r=>`<option value="${r.id}">${esc(r.number)}</option>`).join('')||'<option value="">Aucune chambre libre de ce type</option>'}</select></label><button class="p">Confirmer</button> <button type="button" class="s" onclick="closeD()">Annuler</button></form>`)}
async function doConf(e,id){e.preventDefault();if(!e.target.r.value)return;await setB(id,'confirmee',{room_id:+e.target.r.value});closeD();const b=data.find(x=>x.id===id);if(b)window.open(wa(cw(gp(b)),msg(b)),'_blank')}
function vRooms(){return `<h2 style="margin-bottom:12px">Chambres et tarifs</h2>${conf()?`<p><button class="p" onclick="addRoom()">Ajouter une chambre</button></p>`:''}
<div class="card scroll"><table>${rooms.map(r=>`<tr><td><b>${esc(r.number)}</b></td><td>${esc(r.room_types?.name)}</td><td>${manage()?`<select onchange="roomSt(${r.id},this.value)">${['libre','occupee','nettoyage','maintenance'].map(s=>`<option value="${s}" ${s===r.status?'selected':''}>${S[s]}</option>`).join('')}</select>`:tag(r.status)}</td></tr>`).join('')}</table></div>
<h3 style="margin:20px 0 8px">Types de chambre</h3><div class="grid">${types.map(t=>`<div class="card"><b>${esc(t.name)}</b><div class="price">${fmt(t.price)}</div>${t.photo_url?`<img src="${esc(t.photo_url)}" alt="" style="width:100%;height:110px;object-fit:cover;border-radius:6px;margin:6px 0">`:''}${conf()?`<button class="s sm" onclick="setPrice(${t.id},${t.price})">Modifier le prix</button><button class="s sm" onclick="photo(${t.id})">Photo</button>`:''}</div>`).join('')}</div>`}
async function setPrice(id,p){const v=prompt('Nouveau prix par nuit (F CFA)',p);if(v&&+v>=0){await db.from('room_types').update({price:+v}).eq('id',id);await load();render()}}
async function addRoom(){const n=prompt('Numéro de la chambre');if(!n)return;const t=prompt('Type : '+types.map(t=>t.id+' = '+t.name).join(', '),types[0]?.id);if(!t)return;
 const{error}=await db.from('rooms').insert({number:n.trim(),type_id:+t});if(error)return toast(error.message);await load();render()}
function vUsers(){return `<h2 style="margin-bottom:6px">Utilisateurs et accès</h2><p class="mut">Le personnel crée son compte comme un client (onglet Connexion), puis vous lui attribuez son rôle ici.</p>
<div class="card scroll"><table>${users.map(u=>`<tr><td><b>${esc(u.full_name)}</b><div class="mut">${esc(u.phone)}</div></td><td><select ${u.id===me.id?'disabled':''} onchange="setRole('${u.id}',this.value)">${Object.entries(R).map(([k,v])=>`<option value="${k}" ${k===u.role?'selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`}
async function setRole(id,role){const{error}=await db.from('profiles').update({role}).eq('id',id);toast(error?error.message:'Rôle mis à jour')}

/* ---- PWA ---- */
let DP=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;$('#inst').hidden=false});
$('#inst').onclick=async()=>{DP.prompt();await DP.userChoice;$('#inst').hidden=true};
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
</body>
</html>
